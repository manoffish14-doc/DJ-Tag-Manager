name: Build Mac App (v3)
on:
  push:
    branches: [v3-development]
    tags: ['v3.*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: arm64
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller
      - name: Build Mac application
        run: |
          pyinstaller --noconfirm --clean --windowed \
            --name "DJ Tag Manager" \
            --osx-bundle-identifier "com.djtagmanager.app" \
            --target-arch arm64 \
            --collect-all librosa \
            --collect-all tkinterdnd2 \
            --add-data "update_helper.py:." \
            app.py
      - name: Package and checksum
        run: |
          cd dist
          ditto -c -k --keepParent "DJ Tag Manager.app" "DJ-Tag-Manager-Mac.zip"
          shasum -a 256 "DJ-Tag-Manager-Mac.zip" > "DJ-Tag-Manager-Mac.zip.sha256"
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DJ-Tag-Manager-v3-Apple-Silicon
          path: |
            dist/DJ-Tag-Manager-Mac.zip
            dist/DJ-Tag-Manager-Mac.zip.sha256
      - name: Publish public GitHub Release on version tag
        if: startsWith(github.ref, 'refs/tags/v3.')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/DJ-Tag-Manager-Mac.zip \
            dist/DJ-Tag-Manager-Mac.zip.sha256 \
            --title "DJ Tag Manager ${GITHUB_REF_NAME}" \
            --notes "DJ Tag Manager v3 development release."
